name: Release

on:
  push:
    tags:
      - "@heroui/**"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    if: github.repository == 'heroui-inc/heroui'
    runs-on: ubuntu-latest
    environment: npm-publish
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install
        uses: ./.github/common-actions/install

      - name: Parse tag
        id: tag
        shell: bash
        run: |
          REF="${GITHUB_REF_NAME}"
          # tag format: @scope/name@version -> split on the LAST "@"
          PKG_NAME="${REF%@*}"
          PKG_VERSION="${REF##*@}"
          PKG_DIR="$(pnpm list -r --filter "$PKG_NAME" --depth -1 --parseable | tail -n1)"

          echo "name=$PKG_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          echo "dir=$PKG_DIR" >> "$GITHUB_OUTPUT"
          echo "Publishing $PKG_NAME@$PKG_VERSION ($PKG_DIR)"

      - name: Build packages
        run: pnpm --filter "${{ steps.tag.outputs.name }}" build

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@11

      # >>> debug-ec473e: trusted-publishing diagnostics (remove after verification)
      - name: Debug trusted publishing env
        working-directory: ${{ steps.tag.outputs.dir }}
        run: |
          echo "node: $(node -v)"
          echo "npm: $(npm -v)  (path: $(command -v npm))"
          echo "OIDC request url set: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"
          echo "OIDC request token set: ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+yes}"
          echo "NPM_CONFIG_USERCONFIG=${NPM_CONFIG_USERCONFIG:-<unset>}"
          echo "--- userconfig .npmrc (token redacted) ---"
          UC="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          [ -f "$UC" ] && sed -E 's/(_authToken=).*/\1<redacted>/' "$UC" || echo "(no userconfig npmrc)"
          echo "--- project .npmrc (token redacted) ---"
          [ -f .npmrc ] && sed -E 's/(_authToken=).*/\1<redacted>/' .npmrc || echo "(no project npmrc)"
          echo "--- package name/version ---"
          node -p "const p=require('./package.json'); p.name+'@'+p.version"
          echo "--- dry-run publish (verbose) ---"
          npm publish --dry-run --access public --foreground-scripts 2>&1 | tail -30 || true
      # <<< debug-ec473e

      - name: Publish to npm
        working-directory: ${{ steps.tag.outputs.dir }}
        env:
          # Use a clean npmrc with no _authToken so npm performs OIDC trusted
          # publishing instead of authenticating with an injected token.
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/.npmrc-publish
          NODE_AUTH_TOKEN: ""
        run: |
          printf 'registry=https://registry.npmjs.org/\n' > "$NPM_CONFIG_USERCONFIG"
          mkdir -p "$RUNNER_TEMP/heroui-release"
          PACKAGE_TARBALL="$(node -p "const pkg = require('./package.json'); pkg.name.replace('@', '').replace('/', '-') + '-' + pkg.version + '.tgz'")"
          pnpm pack --pack-destination "$RUNNER_TEMP/heroui-release"
          npm publish "$RUNNER_TEMP/heroui-release/$PACKAGE_TARBALL" --access public
