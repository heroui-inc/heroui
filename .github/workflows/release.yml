name: Release

on:
  push:
    tags:
      - "@heroui/**"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    if: github.repository == 'heroui-inc/heroui'
    runs-on: ubuntu-latest
    environment: npm-publish
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install
        uses: ./.github/common-actions/install

      - name: Parse tag
        id: tag
        shell: bash
        run: |
          REF="${GITHUB_REF_NAME}"
          # tag format: @scope/name@version -> split on the LAST "@"
          PKG_NAME="${REF%@*}"
          PKG_VERSION="${REF##*@}"
          PKG_DIR="$(pnpm list -r --filter "$PKG_NAME" --depth -1 --parseable | tail -n1)"

          echo "name=$PKG_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          echo "dir=$PKG_DIR" >> "$GITHUB_OUTPUT"
          echo "Publishing $PKG_NAME@$PKG_VERSION ($PKG_DIR)"

      - name: Build packages
        run: pnpm --filter "${{ steps.tag.outputs.name }}" build

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@11

      - name: Publish to npm
        working-directory: ${{ steps.tag.outputs.dir }}
        run: |
          mkdir -p "$RUNNER_TEMP/heroui-release"
          PACKAGE_TARBALL="$(node -p "const pkg = require('./package.json'); pkg.name.replace('@', '').replace('/', '-') + '-' + pkg.version + '.tgz'")"
          pnpm pack --pack-destination "$RUNNER_TEMP/heroui-release"
          npm publish "$RUNNER_TEMP/heroui-release/$PACKAGE_TARBALL" --access public
