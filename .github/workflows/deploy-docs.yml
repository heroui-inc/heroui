name: Deploy Docs to Cloudflare Workers

on:
  push:
    branches:
      - "v3"
      - "v3.*"
    paths:
      - "apps/docs/**"
      - "packages/react/**"
      - "packages/styles/**"
      - "packages/standard/**"
      - "skills/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-docs.yml"
  pull_request:
    branches:
      - "v3"
      - "v3.*"
    paths:
      - "apps/docs/**"
      - "packages/react/**"
      - "packages/styles/**"
      - "packages/standard/**"
      - "skills/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

concurrency:
  group: deploy-docs-${{ github.event.pull_request.number || github.ref }}
  # Production pushes queue (don't cancel mid-deploy); PR builds cancel on new push.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Skip preview deploys from forks — secrets aren't exposed there and the
    # job would fail. Production pushes and same-repo PRs both run.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    env:
      # GitHub-hosted ubuntu-latest has ~16 GB RAM; 12 GB heap leaves headroom
      # for Turbopack workers, native bundlers and OpenNext.
      NODE_OPTIONS: --max-old-space-size=12288

    steps:
      - name: Checkout branch
        uses: actions/checkout@v6

      - name: Install
        uses: ./.github/common-actions/install

      - name: Cache Next.js build
        uses: actions/cache@v5
        with:
          path: apps/docs/.next/cache
          # Reuse across commits with the same lockfile; the per-SHA suffix
          # lets us write a fresh cache entry every run while restoring from
          # the most recent matching prefix.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build (Next.js + OpenNext worker bundle)
        working-directory: apps/docs
        run: pnpm build:cf

      - name: Deploy to Cloudflare Workers (production)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/docs
          command: deploy --config wrangler.jsonc
          packageManager: pnpm
          # Server-side secrets are managed in the Cloudflare dashboard; 
          # wrangler deploy preserves existing secrets.

      - name: Upload preview version (PR)
        if: github.event_name == 'pull_request'
        id: preview
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/docs
          # `versions upload` inherits secrets from the deployed Worker, so
          # we don't need to re-upload them here.
          command: versions upload --config wrangler.jsonc --preview-alias pr-${{ github.event.pull_request.number }}
          packageManager: pnpm

      - name: Extract preview URL
        if: github.event_name == 'pull_request'
        id: preview_url
        run: |
          # wrangler prints `Preview URL: https://...workers.dev` on success.
          URL=$(printf '%s\n' "${{ steps.preview.outputs.command-output }}" \
            | grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' \
            | head -n 1)
          if [ -z "$URL" ]; then
            echo "Could not parse preview URL from wrangler output."
            exit 0
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request' && steps.preview_url.outputs.url != ''
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: cf-preview
          message: |
            ### Cloudflare Workers preview deployed

            | Name | Status | URL |
            | --- | --- | --- |
            | heroui-docs | Ready | ${{ steps.preview_url.outputs.url }} |

            Build commit: `${{ github.event.pull_request.head.sha }}` · [View workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
