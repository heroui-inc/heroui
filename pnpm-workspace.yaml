packages:
  - "apps/*"
  - "packages/*"
  - "!apps/*/.contentlayer"
  - "!apps/*/.next"
  - "!apps/*/.source"
  - "!apps/*/.turbo"

overrides:
  # GHSA-gcqx-w48m-w2h4: the patch below replaces the resolver's only
  # deepmerge call (cloning static defaults) with Node 22+ structuredClone.
  # Remove this override and patch once upstream drops/fixes deepmerge.
  "@rollup/plugin-node-resolve@16.0.3>deepmerge": "-"
  # Security patches for transitive dependencies. Drop once the parents
  # (eslint, fumadocs-*, postcss-svgo, next, postcss, css-tree, cssnano,
  # @tailwindcss/typography) ship updated ranges.
  # GHSA-2883-xcg3-v3hh, GHSA-w27v-7q3p-w38r, GHSA-4vpr-x523-8j87
  js-yaml@4: "^4.3.2"
  nanoid@3: "^3.3.18"
  svgo@2: "^2.8.4"
  # GHSA-wq5f-xc86-pv6w
  sharp: "^0.35.5"
  # GHSA-68fv-2mgg-jv7q
  source-map-js: "^1.2.2"
  # GHSA-rj75-hqrm-r3gf — 6.x has no release; 7.0.0 only makes walk insertions safe.
  postcss-selector-parser: "^7.1.6"
  # GHSA-q2hr-2g5m-vwhr
  brace-expansion@1: "^1.1.21"
  brace-expansion@5: "^5.0.12"
  # GHSA-g3hv-75wg-m249 — no 10.x backport; consumers (ts-morph, typescript-estree)
  # only call minimatch(), which 11 keeps.
  minimatch@10: "^11.0.9"
  # GHSA-3g3m-2fjr-6pw4 — no 13.x backport; react-docgen-typescript only calls globSync().
  glob@13: "^14.0.6"

saveExact: true

# Keep fresh exact-pinned bumps and `pnpx pkg-pr-new` (QA.yaml) installable; pnpm 11+ defaults to 1440.
minimumReleaseAge: 0

allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  "esbuild": true
  "lmdb": true
  "msgpackr-extract": true
  "sharp": true
  "unrs-resolver": true

patchedDependencies:
  "@rollup/plugin-node-resolve@16.0.3": patches/@rollup__plugin-node-resolve@16.0.3.patch
